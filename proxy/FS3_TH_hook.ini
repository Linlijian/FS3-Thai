; Fantasia Sango 3 Thai hook (d3dx9_25.dll proxy) -- copy next to FS3.exe together with
; FS3_TH_map.txt (Thai channel) and FS3_TH_text.txt (translations for key expansion).
;
; force_charset        charset handed to D3DXCreateFontA; -1 = leave the game's value (keep it -1).
; force_face           override the game's font face; empty = keep.
; log_textout          1 = log GDI TextOut/ExtTextOut calls (verbose).
; log_mb2wc            1 = log MultiByteToWideChar input, 2 = input + returned UTF-16. Thai-channel hits are always logged.
; log_drawtext         1 = log ID3DXFont::DrawTextA/W calls (deduplicated) and Thai drawing.
; log_max_lines        stop logging after this many lines.
; thai_layout          1 = re-lay out Thai pieces (real widths, marks joined into clusters). 0 = engine draws as-is.
; thai_use_engine_font 1 = draw Thai with the game's own font object (24 px, small); 0 = proxy-created font
;                      (auto-falls back to 1 on the first exception, see the log).
; thai_face            font for thai_use_engine_font=0. EMPTY = a larger copy of the game's own face + charset
;                      (Thai faces like Tahoma / Leelawadee UI crashed d3dx9_25 on combining marks).
; thai_charset         only used with a non-empty thai_face.
; thai_scale_pct       Thai font height as % of the game font (155 -> 37 px, tuned in game).  thai_dy: 999 = auto vertical centring.
; wrap_width           px width for key-expanded text (580 = tuned in game; the original's widest line is 504 = 21 CJK cells).
; line_pitch_pct       line pitch as % of the Thai font height for key-expanded text (90 -> 33 px at 37 px).
; wrap_rules           per-panel text width, comma list of "height@x=px" (x +-4 px, y +-2; x 0 = any x; >x = x or further right,
;                      for centred labels) with optional "/e" = draw at the game's own size there (narrow panels).
;                      ":y" after x also requires that y (+-2), for panels that share an x. First match wins, else wrap_width. The log prints "key N at h= x=" for every new place a key is drawn.
;                      12@689=96 equip help, 12@673=112 hotkey item help, 12@662=128 skill help (use / hotkeys),
;                      24@>640=130/e and 20@>640=135/e right-column item / skill names, 20@260=140/e skill list (use),
;                      12@17=72/e battle item / skill list, 12@>730:85=62/e battle formation label (top right),
;                      Labels at game size, no wrap (=300): 20@>240:104 inventory tabs, 24@>440:101 hotkey tabs,
;                      20@>220:111 / :139 equip stat bar, 20@328 + 20@388 status panel.
;                      20@32:209 victory EXP label, 20@294 + 24@55 level-up stats, 12@>730:85 battle formation label.
;                      16@288:330 + 16@328:363 battle popup lines 1-2 (item name is drawn after it at the Chinese width).
;                      12@0=168 item help elsewhere (the engine wraps it at 14 cells).
; box_lines            translators: >0 = at the first translated line, lay out EVERY text with the real font and log
;                      'overflow: key N needs M lines' for texts longer than this (takes a few seconds). 0 = off (players).
;                      tools/overflow_report.py turns those lines into TSV addresses.
[hook]
force_charset=-1
force_face=
log_textout=0
log_mb2wc=0
log_drawtext=0
log_max_lines=200000
thai_layout=1
thai_use_engine_font=0
thai_face=
thai_charset=1
thai_scale_pct=155
thai_dy=999
wrap_width=580
line_pitch_pct=90
box_lines=0
wrap_rules=16@288:330=300/e,16@328:363=300/e,20@294:70=300/e,20@294:98=300/e,20@294:126=300/e,20@294:154=300/e,20@294:182=300/e,24@55=300/e,20@32:209=300/e,20@>240:104=300/e,24@>440:101=300/e,20@>220:111=300/e,20@>220:139=300/e,20@328=300/e,20@388=300/e,12@689=96,12@673=112,12@662=128,24@>640=130/e,20@>640=135/e,20@260=140/e,12@17=72/e,12@>730:85=62/e,12@0=168
